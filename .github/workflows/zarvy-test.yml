name: zarvy-test
# 예약·수동 실행만. PR 등 외부에서 시작할 수 있는 트리거는 두지 않는다(비밀값 보호).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  actions: read
concurrency: zarvy-test
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check test site
        env:
          URL: ${{ secrets.ZARVY_TEST_URL }}
          WEBHOOK: ${{ secrets.ZARVY_DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 200 · 302(로그인 화면) · 403(접속 허용 IP 밖에서 막음)은 서버가 살아 있다는 뜻. 순간 끊김으로 울리지 않게 30초 간격으로 세 번 본다.
          ok=0; code=
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL" || true)
            echo "응답 $code"
            case "$code" in 200|302|403) ok=1; break;; esac
            [ $i -lt 3 ] && sleep 30
          done
          # 상태가 바뀔 때만 알린다: 직전 실행 결과(실패 = 멈춤)와 비교한다.
          prev=$(gh run list -R "$GITHUB_REPOSITORY" -w zarvy-test.yml --status completed -L 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || true)
          post() { curl -s -o /dev/null -H 'content-type: application/json' -d "$1" "$WEBHOOK"; }
          if [ $ok = 0 ]; then
            [ "$prev" != failure ] && post "{\"embeds\":[{\"title\":\"🚨 Zarvy 테스트 사이트 응답 없음\",\"color\":15158332,\"description\":\"바깥 감시가 30초 간격으로 3번 확인했지만 응답하지 않습니다(마지막 응답 ${code:-없음}).\"}]}"
            exit 1
          fi
          [ "$prev" = failure ] && post '{"embeds":[{"title":"✅ Zarvy 테스트 사이트 다시 응답","color":5763719,"description":"테스트 사이트가 다시 응답합니다."}]}'
          true
